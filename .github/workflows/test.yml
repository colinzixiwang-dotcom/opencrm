name: Validate demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: morpho_test
          POSTGRES_USER: morpho_test
          POSTGRES_PASSWORD: isolated_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morpho_test -d morpho_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: morpho_test
      PGUSER: morpho_test
      PGPASSWORD: isolated_ci_only
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - run: ./scripts/go.sh test -race ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reports
          path: test-results/
